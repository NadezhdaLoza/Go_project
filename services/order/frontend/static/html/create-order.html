<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" type="text/css" href="/static/css/materialize.css">
    <link rel="stylesheet" type="text/css" href="/static/css/styles.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <title>Создать наряд</title>
</head>

<body class="has-fixed-sidenav">
    <header></header>
    <main class="white">
        <div class="container">
            <div class="section">
                <h5>Создать новый наряд</h5>
                
                <form class="col s12" action="/documents/orders/create" method="post">
                    <div class="row">
                        <div class="col s6">
                            <!-- Организация -->
                            <div class="input-field">
                                <select name="customer_id" class="browser-default" required>
                                    <option value="" disabled selected>Выберите организацию</option>
                                    {{ range .Organizations }}
                                    <option value="{{ .Id }}">{{ .Name }}</option>
                                    {{ end }}
                                </select>
                                
                            </div>
                            
                            <!-- Структурное подразделение -->
                            <div class="input-field">
                                <select name="department_id" class="browser-default" required>
                                    <option value="" disabled selected>Выберите подразделение</option>
                                    {{ range .Departments }}
                                    <option value="{{ .ID }}">{{ .Name }}</option>
                                    {{ end }}
                                </select>
                                
                            </div>
                            
                            <!-- Бригадир -->
                            <div class="input-field">
                                <select name="foreman_id" class="browser-default" required>
                                    <option value="" disabled selected>Выберите бригадира</option>
                                    {{ range .Employees }}
                                    <option value="{{ .Id }}">{{ .LastName }} {{ .FirstName }} {{ .MiddleName }}</option>
                                    {{ end }}
                                </select>
                                
                            </div>
                        </div>
                        
                        <div class="col s1"></div>
                        
                        <div class="col s5">
                            <!-- Номер наряда -->
                            <div class="input-field">
                                <input id="order_number" name="order_number" type="text" class="validate" required>
                                <label for="order_number">Номер наряда</label>
                            </div>
                            
                            <!-- Дата наряда -->
                            <div class="input-field">
                                <input id="order_date" name="order_date" type="date" class="validate" required>
                                <label for="order_date">Дата наряда</label>
                            </div>
                        </div>
                    </div>
                    
                    <div class="row">
                        <div class="col s12">
                            <button class="btn-flat white blue-text" type="submit">
                                <i class="material-icons left">check</i>Подтвердить
                            </button>
                            
                            <a href="/documents/orders" class="waves-effect waves-blue btn-flat white blue-text" style="margin-left: 10px;">
                                <i class="material-icons left">arrow_back</i>Назад
                            </a>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </main>
    
    <script src="/static/js/nav.js"></script>
    <script src="/static/js/sidenav.js"></script>
    <script src="/documents/static/js/sidenav-documents.js"></script>
    <script src="/static/js/materialize.min.js"></script>
    <script>
        // Инициализация Materialize select
        document.addEventListener('DOMContentLoaded', function() {
            var elems = document.querySelectorAll('select');
            M.FormSelect.init(elems);
        });
    </script>
</body>
</html>
