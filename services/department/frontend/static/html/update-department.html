<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" type="text/css" href="/static/css/materialize.css">
    <link rel="stylesheet" type="text/css" href="/static/css/styles.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <title>Обновить подразделение</title>
</head>

<body class="has-fixed-sidenav">
    <header>
    </header>
    <main class="white">
        <div class="container">
            <div class="section">
                <h5>Внести изменения в подразделение</h5>
                <form class="col s12" action="/department/departments/update" method="post">
                    <input name="id" type="hidden" value="{{ .ID }}">
                    <div class="row">
                        <div class="input-field col s8">
                            <input id="name" name="name" value="{{ .Name | html }}" type="text" class="validate" required>
                            <label for="name">Наименование подразделения</label>
                        </div>
                    </div>
                    <div class="row">
                        <div class="input-field col s4">
                            <input id="work_conditions_class" name="work_conditions_class" value="{{ .WorkConditionsClass | html }}" type="text" class="validate">
                            <label for="work_conditions_class">Класс условий труда</label>
                        </div>
                        <div class="input-field col s2">
                            <input id="work_day_start" name="work_day_start" value="{{ .WorkDayStart }}" type="time" class="validate">
                            <label for="work_day_start">Начало работы</label>
                        </div>
                        <div class="input-field col s2">
                            <input id="work_day_end" name="work_day_end" value="{{ .WorkDayEnd }}" type="time" class="validate">
                            <label for="work_day_end">Окончание работы</label>
                        </div>
                    </div>
                    <button class="waves-effect waves-blue btn-flat white blue-text" type="submit"><i
                            class="material-icons left">done</i>Подтвердить</button>
                    <a href="/department/departments" class="waves-effect waves-blue btn-flat white blue-text" style="margin-left: 10px;">
                        <i class="material-icons left">arrow_back</i>Назад
                    </a>
                </form>
            </div>
        </div>
    </main>
    <script src="/static/js/nav.js"></script>
    <script src="/static/js/sidenav.js"></script>
    <script src="/department/static/js/sidenav-department.js"></script>
    <script src="/static/js/materialize.min.js"></script>
</body>
</html>
